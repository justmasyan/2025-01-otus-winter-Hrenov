spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/db
    username: postgres
    password: postgres

  sql:
    init:
      mode: always

  jpa:
    generate-ddl: false
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: none

    show-sql: true

  mvc:
    hiddenmethod:
      filter:
        enabled: true