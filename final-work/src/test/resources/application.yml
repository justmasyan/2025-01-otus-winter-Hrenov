spring:
  datasource:
    url: jdbc:h2:mem:maindb

  sql:
    init:
      mode: never

  jpa:
    open-in-view: false
    generate-ddl: false
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: none

    show-sql: true

jwt:
  private.key: classpath:app.key
  public.key: classpath:app.pub