<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application pages</title>

    <script>
        function onLoadPage(id, accountId) {
            findCourse(id)
            findLectorsByCourseId(id)
            findGroupsByCourseId(id)
        }
    </script>

    <script>
        function findCourse(id) {
            fetch(`/api/courses/${id}`)
            .then(rawResponse => rawResponse.json())
            .then(json => {
                tableForCourse(json)
                tableForTopics(json)
                tableForLectors(json)
            })
        }
    </script>

    <script>
        function findLectorsByCourseId(id) {
            fetch(`/api/lectors/courses/${id}`)
            .then(rawResponse => rawResponse.json())
            .then(json => {
                tableForLectors(json)
            })
        }
    </script>

    <script>
        function findGroupsByCourseId(id) {
            fetch(`/api/groups/courses/${id}`)
            .then(rawResponse => rawResponse.json())
            .then(json => {
                tableForGroups(json)
            })
        }
    </script>

    <script>
        function tableForCourse(course) {
            let tbody = document.getElementById("course-table-tbody");

            let tr = document.createElement('tr')

            let tdTitle = document.createElement('td')
            tdTitle.innerHTML = course.title
            tr.appendChild(tdTitle)
            let tdPrice = document.createElement('td')
            tdPrice.innerHTML = course.price
            tr.appendChild(tdPrice)
            //Начало следующей группы

            tbody.appendChild(tr)
        }
    </script>

    <script>
        function tableForTopics(course) {
            let tbody = document.getElementById("topics-table-tbody");

            course.lectureTopics.forEach(function(topic){
                let tr = document.createElement('tr')

                let tdTitle = document.createElement('td')
                tdTitle.innerHTML = topic.title
                tr.appendChild(tdTitle)

                tbody.appendChild(tr)
            })
        }
    </script>

    <script>
        function tableForLectors(lectors) {
            let tbody = document.getElementById("lectors-table-tbody");

            lectors.forEach(function(lector){
                let tr = document.createElement('tr')
                let lectorFirstName = document.createElement('td')
                lectorFirstName.innerHTML = lector.firstName
                tr.appendChild(lectorFirstName)

                let lectorLastName = document.createElement('td')
                lectorLastName.innerHTML = lector.lastName
                tr.appendChild(lectorLastName)

                let lectorTitleJob = document.createElement('td')
                lectorTitleJob.innerHTML = lector.jobTitle
                tr.appendChild(lectorTitleJob)

                tbody.appendChild(tr)
            })
        }
    </script>

    <script>
        function tableForGroups(groups) {
            let tbody = document.getElementById("groups-table-tbody");

            groups.forEach(function(group) {
                let tr = document.createElement('tr')

                let tdCode = document.createElement('td')
                let tdCodeHref = document.createElement('a')
                tdCodeHref.href = `/groups/${group.id}`
                tdCodeHref.innerHTML = group.code
                tdCode.appendChild(tdCodeHref)

                let tdStartDate = document.createElement('td')
                tdStartDate.innerHTML = group.startDate

                tr.appendChild(tdCode)
                tr.appendChild(tdStartDate)

                tbody.appendChild(tr)
            })
        }
    </script>

    <script>
        function moveLectorToCourse(courseId) {
            fetch(`/api/lectors/courses/${courseId}`, {
                method: 'POST'
            }).then(function(rawResponse) {
                if (!rawResponse.ok) {
                    rawResponse.json().then(function(errorResponse) {
                        alert(`Ошибка!!! ${errorResponse.message}. Время ${errorResponse.moment}`)
                    })
                } else {
                    alert("Вы успешно стали преподавателем курса")
                }
            })
        }
    </script>

    <script>
        function deleteLectorFromCourse(courseId) {
            fetch(`/api/lectors/courses/${courseId}`, {
                method: 'DELETE'
            }).then(function(rawResponse) {
                if (!rawResponse.ok) {
                    rawResponse.json().then(function(errorResponse) {
                        alert(`Ошибка!!! ${errorResponse.message}. Время ${errorResponse.moment}`)
                    })
                } else {
                    alert("Вы больше не преподаете на этом курсе")
                }
            })
        }
    </script>
</head>

<body th:onload="'onLoadPage(' + ${id} + ', ' + ${accountId} + ')'">

<table border="1">
    <tbody>
    <tr>
        <td><a th:href="@{/courses}">Список доступных курсов</a></td>
        <td><a th:href="@{/account}">Личный кабинет</a></td>
    </tr>
    <tbody>
</table>

<h3>Общая информация о курсе:</h3>

<table border="1">
    <thead>
    <tr>
        <th>Название курса</th>
        <th>Стоимость курса</th>
    </tr>
    </thead>
    <tbody id="course-table-tbody"><tbody>
</table>

<h3>Программа курса:</h3>

<table border="1">
    <thead>
    <tr>
        <th>Название темы</th>
    </tr>
    </thead>
    <tbody id="topics-table-tbody"><tbody>
</table>

<h3>Список преподавателей:</h3>

<table border="1">
    <thead>
    <tr>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Место работы</th>
    </tr>
    </thead>
    <tbody id="lectors-table-tbody"><tbody>
</table>

<p>
    <button id="move-lector-to-course-button" type="button" th:onclick="moveLectorToCourse([[${id}]])">Записаться на курс преподавателем</button>
    <button id="delete-lector-from-course-button" type="button" th:onclick="deleteLectorFromCourse([[${id}]])">Уйти с курса</button>
</p>

<h3>Учебные группы по курсу:</h3>

<table border="1">
    <thead>
    <tr>
        <th>Название группы</th>
        <th>Дата начала обучения</th>
    </tr>
    </thead>
    <tbody id="groups-table-tbody">
</table>

</body>
</html>
