<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Учебная группа</title>

    <script>
        function onLoadPage(id) {
            findGroup(id)
            findLectures(id)
        }
    </script>

    <script>
        function findGroup(id) {
            fetch(`/api/groups/${id}`)
            .then(function(rawResponse) {
                if (rawResponse.ok) {
                    rawResponse.json().then(function(json) {
                        tableForBaseInfo(json)
                    })
                } else {
                    rawResponse.json().then(function(errorResponse) {
                        alert(`Ошибка!!! ${errorResponse.message}. Время ${errorResponse.moment}`)
                        window.location.href = "/error"
                    })
                }
            })
        }
    </script>

    <script>
        function findLectures(id) {
            fetch(`/api/lectures/groups/${id}`)
            .then(function(rawResponse) {
                if (rawResponse.ok) {
                    rawResponse.json().then(function(json) {
                        tableForLectures(json)
                    })
                } else {
                    rawResponse.json().then(function(errorResponse) {
                        alert(`Ошибка!!! ${errorResponse.message}. Время ${errorResponse.moment}`)
                    })
                }
            })
        }
    </script>

    <script>
        function tableForBaseInfo(group) {
            document.getElementById("group-table-tdCode").innerHTML = group.code
            document.getElementById("group-table-tdStartDate").innerHTML = group.startDate

            document.getElementById("group-table-tdHrefCourse").href = `/courses/${group.course.id}`
            document.getElementById("group-table-tdHrefCourse").innerHTML = group.course.title
        }
    </script>

    <script>
        function tableForLectures(lectures) {
            let tbody = document.getElementById("lectures-table-tbody");

            lectures.forEach(function(lecture) {
                let tr = document.createElement('tr')

                let tdTopicTitle = document.createElement('td')
                let tdTopicTitleHref = document.createElement('a')
                tdTopicTitleHref.href = `/lectures/${lecture.id}`
                tdTopicTitleHref.innerHTML = lecture.lectureTopic.title
                tdTopicTitle.appendChild(tdTopicTitleHref)

                let tdUrl = document.createElement('td')
                tdUrl.innerHTML = lecture.url

                let tdStatus = document.createElement('td')
                tdStatus.innerHTML = lecture.status.text

                let tdLectureTime = document.createElement('td')
                tdLectureTime.innerHTML = lecture.lectureTime

                tr.appendChild(tdTopicTitle)
                tr.appendChild(tdUrl)
                tr.appendChild(tdStatus)
                tr.appendChild(tdLectureTime)

                tbody.appendChild(tr)
            })
        }
    </script>

    <script>
        function addStudentToGroup(groupId){
            fetch(`/api/groups/${groupId}/student`, {
                method: 'POST'
            }).then(function(rawResponse) {
                if (!rawResponse.ok) {
                    rawResponse.json().then(function(errorResponse) {
                        alert(`Ошибка!!! ${errorResponse.message}. Время ${errorResponse.moment}`)
                    })
                } else {
                    alert("Вы успешно добавились в группу")
                }
            })
        }
    </script>

    <script>
        function removeStudentFromGroup(groupId){
            fetch(`/api/groups/${groupId}/student`, {
                method: 'DELETE'
            }).then(function(rawResponse) {
                if (!rawResponse.ok) {
                    rawResponse.json().then(function(errorResponse) {
                        alert(`Ошибка!!! ${errorResponse.message}. Время ${errorResponse.moment}`)
                    })
                } else {
                    alert("Вы покинули группу")
                }
            })
        }
    </script>

</head>

<body th:onload="onLoadPage([[${id}]])">

<table border="1">
    <tbody>
    <tr>
        <td><a th:href="@{/courses}">Список доступных курсов</a></td>
        <td><a th:href="@{/lecture-topics}">Список конкретных тем</a></td>
        <td><a th:href="@{/account}">Личный кабинет</a></td>
        <td><a th:href="@{/authentication}">Получить токен</a></td>
    </tr>
    <tbody>
</table>

<h3>Информация о группе:</h3>

<table border="1">
    <thead>
    <tr>
        <th>Код группы</th>
        <th>Начало обучения</th>
        <th>Курс обучения</th>
    </tr>
    </thead>
    <tbody id="group-table-tbody">
    <tr>
        <td id="group-table-tdCode"></td>
        <td id="group-table-tdStartDate"></td>
        <td><a id="group-table-tdHrefCourse"></a></td>
    </tr><tbody>
</table>

<p>
    <button id="add-student-to-group-button" type="button" th:onclick="addStudentToGroup([[${id}]])">Записаться в группу</button>
    <button id="remove-student-from-group-button" type="button" th:onclick="removeStudentFromGroup([[${id}]])">Уйти из группы</button>
</p>

<h3>Список лекций:</h3>

<table border="1">
    <thead>
    <tr>
        <th>Тема лекции</th>
        <th>Ссылка на лекцию</th>
        <th>Статус лекции</th>
        <th>Время лекции</th>
    </tr>
    </thead>
    <tbody id="lectures-table-tbody">
</table>

</body>
</html>
