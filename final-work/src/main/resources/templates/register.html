<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Application pages</title>

    <script>
        function registerAccount() {
            const password = document.getElementById("register-password-input").value
            const confirmPassword = document.getElementById("register-confirm-password-input").value

            if(password != confirmPassword) {
                alert("Пароли не совпадают")
                return ;
            }

            const roleSelect = document.getElementById("register-role-select")

            if(roleSelect.options[roleSelect.selectedIndex].text === "Студент") {
                registerStudent()
            } else if (roleSelect.options[roleSelect.selectedIndex].text === "Преподаватель") {
                registerLector()
            }
        }
    </script>

    <script>
        function registerStudent() {
            const username = document.getElementById("register-username-input").value
            const password = document.getElementById("register-password-input").value
            const confirmPassword = document.getElementById("register-confirm-password-input").value
            const firstName = document.getElementById("register-first-name-input").value
            const lastName = document.getElementById("register-last-name-input").value
            const roleId = document.getElementById("register-role-select").value
            const studyPlace = document.getElementById("register-student-study-place-input").value

            const student = {
                firstName: firstName,
                lastName: lastName,
                studyPlace: studyPlace,
                account: {
                    username: username,
                    password: password,
                    authority: { id: roleId }
                }
            }

            fetch("/api/students/new", {
                method: 'POST',
                headers: {
                  'Accept': 'application/json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(student)
            }).then(rawResponse => rawResponse.json())
            .then(json => {
                alert("Регистрация прошла успешно")
                window.location.href = "/authentication"
            })
        }
    </script>

    <script>
        function registerLector() {
            const username = document.getElementById("register-username-input").value
            const password = document.getElementById("register-password-input").value
            const confirmPassword = document.getElementById("register-confirm-password-input").value
            const firstName = document.getElementById("register-first-name-input").value
            const lastName = document.getElementById("register-last-name-input").value
            const roleId = document.getElementById("register-role-select").value
            const jobTitle = document.getElementById("register-lector-job-input").value

            const lector = {
                firstName: firstName,
                lastName: lastName,
                jobTitle: jobTitle,
                account: {
                    username: username,
                    password: password,
                    authority: { id: roleId }
                }
            }

            fetch("/api/lectors/new", {
                method: 'POST',
                headers: {
                  'Accept': 'application/json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify(lector)
            }).then(rawResponse => rawResponse.json())
            .then(json => {
                alert("Регистрация прошла успешно")
                window.location.href = "/authentication"
            })
        }
    </script>

    <script>
        function loadRoles(){
            let roleSelect = document.getElementById('register-role-select');
            fetch('/api/roles').then(response => response.json())
                .then(json => {
                    json.forEach(function(role) {
                    let roleOption = document.createElement("option");

                    roleOption.textContent = role.description;
                    roleOption.value = role.id;
                    roleSelect.appendChild(roleOption);
                })
            })
        }
    </script>

    <script>
        function showInputsBySelect(select) {
            const studentStudyPlace = document.getElementById("student-study-place-row")
            studentStudyPlace.style.display = 'none'
            const lectorJob = document.getElementById("lector-job-row")
            lectorJob.style.display = 'none'

            if(select.options[select.selectedIndex].text === "Студент"){
                studentStudyPlace.style.display = "table-row"
            }

            if(select.options[select.selectedIndex].text === "Преподаватель"){
                lectorJob.style.display = "table-row"
            }

        }
    </script>
</head>

<body onload="loadRoles();">

<table border="1">
    <tbody>
    <tr>
        <td><a href="courses.html" th:href="@{/courses}">Список доступных курсов</a></td>
        <td><a href="account.html" th:href="@{/account}">Личный кабинет</a></td>
    </tr>
    <tbody>
</table>

<h3>Заполните данные для регистрации:</h3>

<form id="register_account_form" action="authentication.html">

    <table border="1">
        <tbody>
        <tr>
            <td><label for="register-username-input">Логин</label></td>
            <td><input id="register-username-input" name="title" type="text" required/></td>
        </tr>
        <tr>
            <td><label for="register-password-input">Пароль</label></td>
            <td><input id="register-password-input" name="title" type="text" required/></td>
        </tr>
        <tr>
            <td><label for="register-confirm-password-input">Подтверждение пароля</label></td>
            <td><input id="register-confirm-password-input" name="title" type="text" required/></td>
        </tr>
        <tr>
            <td><label for="register-first-name-input">Имя</label></td>
            <td><input id="register-first-name-input" name="title" type="text" required/></td>
        </tr>
        <tr>
            <td><label for="register-last-name-input">Фамилия</label></td>
            <td><input id="register-last-name-input" name="title" type="text" required/></td>
        </tr>

        <tr>
            <td><label for="register-role-select">Кто вы</label></td>
            <td><select id="register-role-select" onChange="showInputsBySelect(this);" required></select></td>
        </tr>

        <tr id="student-study-place-row">
            <td><label for="register-student-study-place-input">Место учебы</label></td>
            <td><input id="register-student-study-place-input" name="title" type="text" required/></td>
        </tr>

        <tr id="lector-job-row" style="display: none;">
            <td><label for="register-lector-job-input">Место работы</label></td>
            <td><input id="register-lector-job-input" name="title" type="text" required/></td>
        </tr>
        <tbody>
    </table>

    <div class="row">
        <button id="register-account-button" type="button" onclick="registerAccount()">Save</button>
    </div>
</form>

</body>
</html>
