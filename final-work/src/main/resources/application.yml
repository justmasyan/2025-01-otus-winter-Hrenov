spring:
  mvc:
    favicon:
      enabled: true

  datasource:
    url: jdbc:h2:mem:maindb

  sql:
    init:
      mode: never

  h2:
    console:
      enabled: true

  jpa:
    open-in-view: false
    generate-ddl: false
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: none

    show-sql: true

jwt:
  lifetime: 20h
  private.key: classpath:app.key
  public.key: classpath:app.pub

flyway:
  enabled: true
  clean-on-validation-error: false

logging:
  level:
    org:
      springframework: TRACE