spring:
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always

  jpa:
    generate-ddl: false
    properties:
      hibernate:
        format_sql: false
    hibernate:
      ddl-auto: none

    show-sql: true

  mvc:
    hiddenmethod:
      filter:
        enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,logfile
    enabled-by-default: false
  endpoint:
    health:
      show-details: always
      enabled: true
    metrics:
      enabled: true
    logfile:
      enabled: true
  health:
    defaults:
      enabled: true

logging:
  file:
    path: ./logs/spring-boot-logger.log